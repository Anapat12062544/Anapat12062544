name: Activity graph

on:
  schedule:
    # 17:00 UTC is 00:00 Asia/Bangkok.
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate activity graph
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/activity_graph.py

      - name: Commit activity graph if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- activity-2026.svg
          if git diff --cached --quiet -- activity-2026.svg; then
            echo "activity-2026.svg unchanged"
          else
            git commit -m "Update 2026 weekday contribution graph"
            git push
          fi
